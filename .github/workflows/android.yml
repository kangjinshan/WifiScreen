name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0'
      - name: Prepare release signing
        env:
          SIGNING_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for key in ('SIGNING_KEYSTORE', 'SIGNING_PASSWORD', 'SIGNING_ALIAS'):
              if not os.environ.get(key):
                  raise SystemExit('Missing release signing secret: ' + key)
          directory = Path(os.environ['RUNNER_TEMP']) / 'wifiscreen-signing'
          directory.mkdir(mode=0o700, exist_ok=True)
          keystore = directory / 'release.jks'
          password = directory / 'password'
          keystore.write_bytes(base64.b64decode(os.environ['SIGNING_KEYSTORE'], validate=True))
          password.write_text(os.environ['SIGNING_PASSWORD'])
          keystore.chmod(0o600)
          password.chmod(0o600)
          Path('signing.properties').write_text('storeFile=' + str(keystore) + '\nstorePasswordFile=' + str(password) + '\nkeyAlias=' + os.environ['SIGNING_ALIAS'] + '\n')
          PY
      - name: Test, lint and build signed APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Verify and package APK
        id: apk
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, subprocess
          from pathlib import Path
          apk = Path('app/build/outputs/apk/release/app-release.apk')
          tools = Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0'
          badging = subprocess.check_output([str(tools / 'aapt'), 'dump', 'badging', str(apk)], text=True)
          match = re.search(r"package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'", badging)
          if not match or match[1] != 'com.kanayama.wifiscreen' or 'application-debuggable' in badging:
              raise SystemExit('Unexpected or debuggable APK')
          version = match[3]
          if os.environ['GITHUB_REF'].startswith('refs/tags/') and os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('Git tag does not match APK versionName')
          cert = subprocess.check_output([str(tools / 'apksigner'), 'verify', '--print-certs', str(apk)], text=True)
          certificate = re.search(r'Signer #1 certificate SHA-256 digest: (\w+)', cert).group(1)
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          output = Path('../dist')
          output.mkdir(exist_ok=True)
          name = 'wifiscreen-' + version + '.apk'
          shutil.copyfile(apk, output / name)
          (output / 'SHA256SUMS').write_text(digest + '  ' + name + '\n')
          record = dict(package=match[1], versionCode=int(match[2]), versionName=version,
                        sha256=digest, certificateSha256=certificate, size=apk.stat().st_size,
                        commit=os.environ['GITHUB_SHA'])
          (output / 'build-info.json').write_text(json.dumps(record, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('version=' + version + '\n')
          print(json.dumps(record, indent=2))
          PY
      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: wifiscreen-${{ steps.apk.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.apk.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "WifiScreen $APP_VERSION" --notes-file .github/release-notes.md
      - name: Remove signing files
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'wifiscreen-signing'
          for path in (Path('signing.properties'), directory / 'release.jks', directory / 'password'):
              path.unlink(missing_ok=True)
          PY
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
